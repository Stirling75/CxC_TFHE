[package]
name = "bfv-style-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = "=0.4.6"
rand = "0.8"
rayon = "=1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tfhe = { version = "=1.6.1", features = ["shortint"] }
