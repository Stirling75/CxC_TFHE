[package]
edition = "2021"
rust-version = "1.91.1"
name = "tfhe"
version = "1.7.0"
build = "build.rs"
exclude = [
    "/docs/",
    "/c_api_tests/",
    "/CMakeLists.txt",
    "/js_on_wasm_tests/",
    "/web_wasm_parallel_tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TFHE-rs is a fully homomorphic encryption (FHE) library that implements Zama's variant of TFHE."
homepage = "https://zama.org/"
documentation = "https://docs.zama.org/tfhe-rs"
readme = "README.md"
keywords = [
    "fully",
    "homomorphic",
    "encryption",
    "fhe",
    "cryptography",
]
license = "BSD-3-Clause-Clear"
repository = "https://github.com/zama-ai/tfhe-rs"
resolver = "3"

[package.metadata.docs.rs]
features = [
    "boolean",
    "shortint",
    "integer",
    "gpu",
    "zk-pok",
    "software-prng",
    "strings",
    "hpu",
    "extended-types",
]
rustdoc-args = [
    "--html-in-header",
    "katex-header.html",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-simd",
    "--enable-threads",
    "--enable-bulk-memory",
]

[features]
__c_api = ["dep:cbindgen"]
__force_skip_cbindgen = []
__profiling = []
__wasm_api = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:console_error_panic_hook",
    "dep:serde-wasm-bindgen",
    "dep:getrandom",
    "getrandom/js",
    "dep:wasm-bindgen-futures",
]
avx512 = [
    "tfhe-fft/avx512",
    "tfhe-ntt/avx512",
    "pulp/x86-v4",
]
boolean = []
