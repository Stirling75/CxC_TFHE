    "boolean",
    "__c_api",
]
boolean-js-wasm-api = [
    "boolean",
    "__wasm_api",
]
cross-origin-wasm-api = [
    "dep:wasm-par-mq",
    "tfhe-zk-pok?/cross-origin-wasm",
]
default = ["avx512"]
experimental = []
experimental-force_fft_algo_dif4 = []
extended-types = []
gpu = [
    "dep:tfhe-cuda-backend",
    "shortint",
]
gpu-debug = [
    "gpu",
    "tfhe-cuda-backend/debug",
]
gpu-debug-fake-multi-gpu = [
    "gpu",
    "tfhe-cuda-backend/debug-fake-multi-gpu",
]
gpu-experimental-multi-arch = [
    "gpu",
    "tfhe-cuda-backend/experimental-multi-arch",
]
gpu-profile = [
    "gpu",
    "tfhe-cuda-backend/profile",
]
gpu-zk = [
    "gpu",
    "zk-pok",
    "tfhe-zk-pok/gpu",
]
high-level-c-api = [
    "boolean-c-api",
    "shortint-c-api",
    "integer",
]
hpu = [
    "dep:tfhe-hpu-backend",
    "shortint",
    "integer",
]
hpu-debug = [
    "hpu",
    "tfhe-hpu-backend/io-dump",
    "tfhe-hpu-backend/utils",
]
hpu-v80 = [
    "hpu",
    "tfhe-hpu-backend/hw-v80",
]
integer = [
