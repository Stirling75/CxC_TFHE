[package]
name = "hybrid-cxc-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
aligned-vec = "0.5.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
dyn-stack = "0.13"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
reborrow = "0.5"
serde = { version = "1.0", features = ["derive"] }
tfhe = { version = "1.6.1", features = ["integer", "shortint", "pbs-stats"] }
tfhe-fft = "0.10"
